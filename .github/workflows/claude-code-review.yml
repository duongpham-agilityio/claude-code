name: Claude Code Review

on:
  pull_request:
    types: [opened, ready_for_review]
    branches: [develop]

jobs:
  review:
    # Skip draft PRs and forks (secrets are not available to forks)
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: /code-review medium --comment ${{ github.event.pull_request.number }}
          # Temporary: shows which tool calls get denied. Remove once the review posts comments.
          show_full_output: true
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 25
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
