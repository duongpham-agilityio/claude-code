name: Claude

on:
  pull_request:
    types: [opened, ready_for_review]
    branches: [develop]

jobs:
  # Runs when a PR is opened or moved out of draft. Draft PRs are skipped.
  review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Follow the conventions in CLAUDE.md.
            Focus on:
            - Correctness bugs and edge cases
            - TypeScript strictness (import type, no enums, no parameter properties)
            - React hooks rules and component conventions (named arrow export, props via `props.x`)
            - Missing tests and stories for new components/hooks
            - Tailwind utility classes for new styles

            Skip formatting nits (Prettier/oxlint cover them).
            Post inline comments for specific issues with
            `mcp__github_inline_comment__create_inline_comment`, then one short
            summary comment with `gh pr comment`.
            Do not add any trailer, signature or attribution line to comments.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 10
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
